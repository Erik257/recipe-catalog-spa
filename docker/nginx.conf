server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все маршруты отдаём через index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов сборки.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
